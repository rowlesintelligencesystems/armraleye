<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — ARMR ALEYE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --cyan: #4ec8d4; --cyan-bright: #6ee0eb; --panel: rgba(12,16,28,0.92); --text: #eef6f9; --muted: #9bb8c4; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:#080a12 url('bg.jpg') center/cover fixed; color:var(--text); min-height:100vh; }
    .overlay { min-height:100vh; background:radial-gradient(ellipse at center,rgba(8,10,18,0.45),rgba(8,10,18,0.88)); padding:2rem 1rem 4rem; }
    .container { max-width:720px; margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; flex-wrap:wrap; gap:1rem; }
    .logo { font-family:'Orbitron',sans-serif; font-weight:600; letter-spacing:0.12em; color:var(--cyan-bright); text-decoration:none; font-size:1.15rem; }
    nav a { color:var(--muted); text-decoration:none; margin-left:1.5rem; font-size:0.92rem; }
    nav a:hover, nav a.active { color:var(--cyan-bright); }
    .card { background:var(--panel); border:1px solid rgba(78,200,212,0.15); border-radius:20px; padding:2.2rem; box-shadow:0 20px 60px rgba(0,0,0,0.4); backdrop-filter:blur(16px); }
    h1 { font-family:'Orbitron',sans-serif; font-size:1.55rem; letter-spacing:0.08em; margin-bottom:1.2rem; }
    label { display:block; color:var(--muted); font-size:0.9rem; margin-bottom:0.35rem; }
    input, textarea {
      width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(78,200,212,0.2);
      border-radius:8px; padding:0.7rem 0.9rem; color:var(--text); font-family:inherit; margin-bottom:1.1rem;
    }
    input:focus, textarea:focus { outline:none; border-color:var(--cyan); }
    button {
      background:linear-gradient(145deg,#7aebf5,#2d9aa6); color:#041018; border:none;
      padding:0.75rem 1.8rem; border-radius:8px; font-weight:500; cursor:pointer;
    }
    button:hover { filter:brightness(1.08); }
    p { color:var(--muted); margin-top:1.5rem; font-size:0.95rem; }
  </style>
</head>
<body>
  <div class="overlay"><div class="container">
    <header>
      <a href="index.html" class="logo">ARMR ALEYE</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="solutions.html">Solutions</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="drive.html">Drive Sync</a>
      </nav>
    </header>
    <div class="card">
      <h1>Contact</h1>
      <form onsubmit="event.preventDefault(); alert('Message captured (demo). In production this would route through the Area 44 secure intake.');">
        <label for="name">Name</label>
        <input id="name" type="text" required placeholder="Your name" />
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@organization.com" />
        <label for="msg">Message</label>
        <textarea id="msg" rows="5" required placeholder="How can we help protect and connect your systems?"></textarea>
        <button type="submit">Send Message</button>
      </form>
      <p>For Drive Sync / Area 44 onboarding, include the folders you wish to protect in your message.</p>
    </div>
  </div></div>
</body>
</html>
