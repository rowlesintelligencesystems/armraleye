<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARMR ALEYE — Intelligent System Integration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #4ec8d4;
      --cyan-bright: #6ee0eb;
      --cyan-glow: rgba(78, 200, 212, 0.4);
      --panel: rgba(11, 15, 26, 0.9);
      --text: #f2f8fb;
      --muted: #a5c2ce;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #070a12;
      color: var(--text);
      overflow-x: hidden;
    }
    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 85% 75% at 50% 42%, transparent 25%, rgba(5, 7, 14, 0.7) 100%),
        url('bg.jpg') center center / cover no-repeat;
      background-color: #0a0e18;
    }
    .particles {
      position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(110, 224, 235, 0.7);
      box-shadow: 0 0 5px rgba(78, 200, 212, 0.55);
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .panel {
      position: relative; z-index: 10;
      width: min(880px, 93vw);
      height: min(700px, 89vh);
      background: var(--panel);
      border-radius: 24px;
      border: 1px solid rgba(78, 200, 212, 0.13);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 28px 80px rgba(0, 0, 0, 0.55),
        0 0 90px rgba(42, 154, 166, 0.07);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel::before {
      content: ''; position: absolute; inset: 0; border-radius: 24px;
      background: radial-gradient(ellipse 60% 35% at 50% 12%, rgba(78, 200, 212, 0.06) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.45rem 2.2rem 0.7rem; position: relative; z-index: 30; flex-shrink: 0;
    }
    .logo {
      display: flex; align-items: center; gap: 0.6rem;
      text-decoration: none; color: var(--cyan);
    }
    .logo-icon { width: 32px; height: 32px; filter: drop-shadow(0 0 7px var(--cyan-glow)); }
    .logo-icon svg { width: 100%; height: 100%; }
    .logo-text {
      font-family: 'Orbitron', sans-serif; font-weight: 600;
      font-size: 1.08rem; letter-spacing: 0.13em; color: #7ee8f2;
      text-shadow: 0 0 12px rgba(78, 200, 212, 0.35);
    }
    nav { display: flex; gap: 1.9rem; }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      font-weight: 400; letter-spacing: 0.03em;
      transition: color 0.2s ease, text-shadow 0.2s ease;
      position: relative; padding: 0.15rem 0;
    }
    nav a:hover, nav a.active {
      color: #9aedf5; text-shadow: 0 0 10px rgba(78, 200, 212, 0.3);
    }
    nav a::after {
      content: ''; position: absolute; left: 0; bottom: -2px;
      width: 0; height: 1px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      transition: width 0.25s ease;
    }
    nav a:hover::after, nav a.active::after { width: 100%; }
    .menu-toggle {
      display: none; background: transparent; border: none;
      color: var(--cyan); cursor: pointer; padding: 0.3rem;
    }
    .content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: flex-end; text-align: center;
      padding: 0 1.6rem 2.6rem; position: relative; z-index: 5; min-height: 0;
    }
    .hamsa-wrap {
      position: absolute; top: 1%; left: 50%; transform: translateX(-50%);
      width: min(400px, 62%); z-index: 1; pointer-events: none;
      filter: drop-shadow(0 0 32px rgba(78, 200, 212, 0.25));
      animation: float 8.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-7px); }
    }
    .hamsa-wrap img { width: 100%; height: auto; display: block; opacity: 0.96; }
    .text-block { position: relative; z-index: 10; max-width: 580px; margin-top: auto; }
    h1 {
      font-family: 'Orbitron', sans-serif; font-weight: 600;
      font-size: clamp(1.4rem, 3.5vw, 2.15rem); letter-spacing: 0.12em;
      color: #ffffff; text-transform: uppercase; line-height: 1.28;
      margin-bottom: 0.9rem; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    }
    .subtitle {
      font-size: clamp(0.9rem, 1.65vw, 1.05rem); font-weight: 300;
      color: var(--muted); line-height: 1.55; max-width: 460px;
      margin: 0 auto 1.8rem; letter-spacing: 0.01em;
    }
    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.8rem 2.3rem; font-size: 0.97rem; font-weight: 500;
      letter-spacing: 0.05em; color: #041018;
      background: linear-gradient(145deg, #7aebf5 0%, #45b8c4 45%, #2d9aa6 100%);
      border: none; border-radius: 9px; cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 20px rgba(78, 200, 212, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      position: relative; overflow: hidden;
    }
    .cta::after {
      content: ''; position: absolute; top: 0; left: -35%;
      width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-18deg); transition: left 0.45s ease;
    }
    .cta:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 28px rgba(78, 200, 212, 0.5), inset 0 1px 0 rgba(255,255,255,0.28);
      filter: brightness(1.06);
    }
    .cta:hover::after { left: 115%; }
    .cta:active { transform: translateY(0) scale(0.98); }
    @media (max-width: 740px) {
      header { padding: 1.1rem 1.25rem 0.5rem; }
      nav {
        display: none; position: absolute; top: calc(100% + 6px); right: 1rem;
        flex-direction: column; background: rgba(11, 15, 26, 0.97);
        border: 1px solid rgba(78, 200, 212, 0.16); border-radius: 12px;
        padding: 0.9rem 1.4rem; gap: 0.85rem;
        box-shadow: 0 14px 36px rgba(0,0,0,0.45); min-width: 150px;
      }
      nav.open { display: flex; }
      .menu-toggle { display: flex; }
      .panel { border-radius: 18px; height: min(660px, 91vh); }
      .hamsa-wrap { width: min(360px, 80%); top: 3%; }
      .content { padding-bottom: 2.1rem; }
      h1 { letter-spacing: 0.08em; font-size: clamp(1.2rem, 5.2vw, 1.65rem); }
    }
    @media (max-width: 400px) {
      .logo-text { font-size: 0.9rem; letter-spacing: 0.09em; }
      .hamsa-wrap { width: 86%; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="particles" id="particles"></div>
    <div class="panel">
      <header>
        <a href="index.html" class="logo" aria-label="ARMR ALEYE Home">
          <div class="logo-icon">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 5C20.5 5 18 8.5 18 12.5V22c0 1.2-0.8 2-2 2s-2.5-1.8-2.5-4V15c0-1.8-1.7-2.5-2.8-1.2-1.1 1.3-0.7 3.5 0.5 5.5l4.5 8.5c1.2 2.2 2.5 4.2 4.5 5.5L24 38l3.8-3.7c2-1.3 3.3-3.3 4.5-5.5l4.5-8.5c1.2-2 1.6-4.2 0.5-5.5-1.1-1.3-2.8-0.6-2.8 1.2v5c0 2.2-1 4-2.5 4s-2-0.8-2-2V12.5C28 8.5 25.5 5 24 5z" fill="#4ec8d4"/>
              <circle cx="24" cy="21" r="4" fill="none" stroke="#8ef0f8" stroke-width="1.5"/>
              <circle cx="24" cy="21" r="1.5" fill="#8ef0f8"/>
              <path d="M19.5 15.5c1.5-1.2 3.2-1.8 4.5-1.8s3 0.6 4.5 1.8" stroke="#8ef0f8" stroke-width="1.15" stroke-linecap="round" fill="none" opacity="0.75"/>
            </svg>
          </div>
          <span class="logo-text">ARMR ALEYE</span>
        </a>
        <button class="menu-toggle" aria-label="Open menu" id="menuBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <nav id="mainNav">
          <a href="index.html" class="active">Home</a>
          <a href="solutions.html">Solutions</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="drive.html">Drive Sync</a>
        </nav>
      </header>
      <div class="content">
        <div class="hamsa-wrap">
          <img src="hamsa.png" alt="Protective Hamsa — ancient wisdom meeting modern technology" width="460" height="620" />
        </div>
        <div class="text-block">
          <h1>Intelligent System Integration</h1>
          <p class="subtitle">
            Protecting and connecting intelligent systems through ancient wisdom and modern technology.
          </p>
          <a href="drive.html" class="cta">Get Started</a>
        </div>
      </div>
    </div>
  </section>
  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 1.1 + Math.random() * 2.1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.setProperty('--delay', (Math.random() * 5) + 's');
      p.style.setProperty('--dur', (3.2 + Math.random() * 4) + 's');
      container.appendChild(p);
    }
    const btn = document.getElementById('menuBtn');
    const nav = document.getElementById('mainNav');
    btn.addEventListener('click', () => nav.classList.toggle('open'));
    nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('open')));
  </script>
</body>
</html>
